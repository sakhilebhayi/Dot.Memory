name: Provision Service Token

# Creates (or rotates) a Sanctum access token for an integrating platform
# (Dot.Central, a reporting job) WITHOUT the plaintext ever existing
# server-side or in logs: the caller generates the random token locally
# and passes only its sha256 here. Sanctum stores exactly that hash, so
# inserting it directly yields a working token whose plaintext only the
# caller holds. The printed TOKEN_ID is combined locally into the bearer
# value "<id>|<plaintext>". Same recipe as provision-guardian-token.yml,
# for any service name. Locally:
#   plain=$(openssl rand -hex 32); printf '%s' "$plain" | shasum -a 256
# then run this workflow with that hash, and use "<TOKEN_ID>|$plain".
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "provision" to confirm creating or rotating the token'
        required: true
      service:
        description: 'Service slug, e.g. dot-central (lowercase letters, digits, dashes)'
        required: true
      token_hash:
        description: 'sha256 hex of the locally generated token plaintext'
        required: true

jobs:
  provision:
    name: Create service token
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Refuse unconfirmed runs
        if: ${{ github.event.inputs.confirm != 'provision' }}
        run: |
          echo '::error::Confirmation input was not "provision" -- aborting.'
          exit 1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Provision
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              SERVICE="${{ github.event.inputs.service }}" \
              TOKEN_HASH="${{ github.event.inputs.token_hash }}" \
              'bash -s' <<'PROVISION'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php

          if ! printf '%s' "$SERVICE" | grep -Eq '^[a-z0-9][a-z0-9-]{2,39}$'; then
            echo "service must be 3-40 lowercase letters, digits or dashes" >&2
            exit 1
          fi
          if ! printf '%s' "$TOKEN_HASH" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "token_hash must be 64 lowercase hex characters" >&2
            exit 1
          fi

          mkdir -p "$HOME/tmp"
          cat > "$HOME/tmp/service-token.php" <<'PHPEOF'
          <?php
          $service = getenv('SERVICE');
          $hash = getenv('TOKEN_HASH');
          $user = \App\Models\User::firstOrCreate(
              ['email' => $service.'@service.dot'],
              [
                  'name' => $service,
                  'password' => \Illuminate\Support\Facades\Hash::make(\Illuminate\Support\Str::random(64)),
              ],
          );
          $user->tokens()->where('name', $service)->delete();
          $token = $user->tokens()->create([
              'name' => $service,
              'token' => $hash,
              'abilities' => ['*'],
          ]);
          echo 'SERVICE_USER='.$user->email.PHP_EOL;
          echo 'TOKEN_ID='.$token->id.PHP_EOL;
          PHPEOF

          $PHP artisan tinker --execute 'require getenv("HOME")."/tmp/service-token.php";'
          rm -f "$HOME/tmp/service-token.php"
          echo "Bearer value for the caller: <TOKEN_ID>|<the plaintext you generated>"
          PROVISION
